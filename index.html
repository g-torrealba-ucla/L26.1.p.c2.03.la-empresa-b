<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empresa B - HTML Plano</title>
</head>

<body>

  <section id="body">
    <h2>Gestión de Empresa B (Obreros y Administrativos)</h2>
    <button id="body_btAgregarObrero">Agregar Obrero</button>
    <button id="body_btAgregarAdministrativo">Agregar Administrativo</button>
    <hr>
    <div>
      Empleado que recibirá el mayor aumento: <span id="body_lblNombreMayorAumento">---</span>
    </div>
    <div>
      El total de la nómina nueva: <span id="body_lblTotalNominaNueva">0</span>
    </div>
  </section>

  <!-- FORMULARIO OBRERO -->
  <section id="obrero" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5>Procesar Obrero</h5>
    <div>
      <label>Nombre:
        <input type="text" id="obrero_inNombre" placeholder="Nombre">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="obrero_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Sueldo actual:
        <input type="number" id="obrero_inSueldoActual" placeholder="Ej: 200">
      </label>
    </div>
    <div>
      <label>Bono:
        <input type="number" id="obrero_inBono" placeholder="Ej: 50">
      </label>
    </div>
    <br>
    <button id="obrero_btCancelar">Cancelar</button>
    <button id="obrero_btAceptar">Aceptar</button>
  </section>

  <!-- FORMULARIO ADMINISTRATIVO -->
  <section id="administrativo" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5>Procesar Administrativo</h5>
    <div>
      <label>Nombre:
        <input type="text" id="administrativo_inNombre" placeholder="Nombre">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="administrativo_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Sueldo Actual:
        <input type="number" id="administrativo_inSueldoActual" placeholder="Ej: 300">
      </label>
    </div>
    <div>
      <label>Cantidad de hijos:
        <input type="number" id="administrativo_inHijos" placeholder="Ej: 2">
      </label>
    </div>
    <br>
    <button id="administrativo_btCancelar">Cancelar</button>
    <button id="administrativo_btAceptar">Aceptar</button>
  </section>

  <script type="module">
    import cEmpresa from "./dist/controllers/cEmpresa.js";
    import cObrero from "./dist/controllers/cObrero.js";
    import cAdministrativo from "./dist/controllers/cAdministrativo.js";

    import vEmpresa from "./dist/views/vEmpresa.js";
    import vObrero from "./dist/views/vObrero.js";
    import vAdministrativo from "./dist/views/vAdministrativo.js";

    // 1. Instanciamos las vistas
    const vistaEmpresa = new vEmpresa();
    const vistaObrero = new vObrero();
    const vistaAdmin = new vAdministrativo();

    // 2. Inyectamos en los controladores
    const controladorObrero = new cObrero(vistaObrero);
    const controladorAdmin = new cAdministrativo(vistaAdmin);
    new cEmpresa(vistaEmpresa, controladorObrero, controladorAdmin);
  </script>
</body>

</html>
