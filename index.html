<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso - HTML Plano</title>
</head>

<body>

  <section id="body">
    <h2>Gestión de empresa</h2>
    <button id="body_btAgregarObrero">Agregar obrero</button>
    <button id="body_btAgregarAdministrtivo">Agregar Administrativo</button>
    <hr>
    <div>
      Empleado que recibirá el mayor aumento: <span id="body_lblNombreMayorAumento">0</span>
    </div>
    <div>
      El total de la nómina nueva: <span id="body_lblTotalNominaNueva">0</span>
    </div>
  </section>

  <section id="obrero" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5 id="alumno_lblAlumno">Procesar Obrero</h5>
    <div>
      <label>Nombre:
        <input type="text" id="obrero_inNombre" placeholder="Nombre del alumno">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="obrero_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Sueldo actual:
        <input type="number" id="alumno_inSueldoActual" placeholder="Ej: 20">
      </label>
    </div>
    <div>
      <label>Bono:
        <input type="number" id="alumno_inBono" placeholder="Ej: 20">
      </label>
    </div>
    <br>
    <button id="alumno_btCancelar">Cancelar</button>
    <button id="alumno_btAceptar">Aceptar</button>
  </section>

  <section id="administrativo" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5 id="administrativo_lblAdministrativo">Procesar Administrativo</h5>
    <div>
      <label>Nombre:
        <input type="text" id="administrativo_inNombre" placeholder="Nombre del alumno">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="administrativo_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Sueldo Actual:
        <input type="number" id="administrativo_inSueldoActual" placeholder="Ej: 20">
      </label>
    </div>
    <div>
      <label>Cantidad de hijos:
        <input type="number" id="alumno_inHijos" placeholder="Ej: 20">
      </label>
    </div>
    <br>
    <button id="adminsitrativo_btCancelar">Cancelar</button>
    <button id="adminsitrativo_btAceptar">Aceptar</button>
  </section>

  <script type="module">
    import Cl_cCurso from "./dist/controllers/Cl_cCurso.js";
    import Cl_cAlumno from "./dist/controllers/Cl_cAlumno.js";

    // Importamos SOLO las vistas planas
    import Cl_vCursoPlain from "./dist/views/Cl_vCursoPlain.js";
    import Cl_vAlumnoPlain from "./dist/views/Cl_vAlumnoPlain.js";

    // 1. Instanciamos las vistas
    const vistaCurso = new Cl_vCursoPlain();
    const vistaAlumno = new Cl_vAlumnoPlain();

    // 2. Inyectamos las vistas en los controladores (¡La magia ocurre aquí!)
    const controladorAlumno = new Cl_cAlumno(vistaAlumno);
    new Cl_cCurso(vistaCurso, controladorAlumno);
  </script>
</body>

</html>
