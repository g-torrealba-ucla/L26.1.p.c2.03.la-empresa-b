<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div id="app-bootstrap" class="container mt-5">
    <h2>Gestión de Curso (Bootstrap)</h2>
    <button type="button" class="btn btn-primary" id="body_btNuevoAlumno">Nuevo Alumno</button>
    <hr>
    <div class="alert alert-info">
      La nota promedio es: <span id="body_lblNotaPromedio" class="fw-bold">0</span>
    </div>
  </div>

  <div class="modal fade" id="alumno" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Procesar Alumno</h5>
        </div>
        <div class="modal-body">
          <label class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="alumno_inNombre">
          <label class="form-label">Cedula:</label>
          <input type="number" class="form-control" id="alumno_inCedula">
          <label class="form-label">Nota 1:</label>
          <input type="number" class="form-control" id="alumno_inNota1">
          <label class="form-label">Nota 2:</label>
          <input type="number" class="form-control" id="alumno_inNota2">
          <label class="form-label">Nota 3:</label>
          <input type="number" class="form-control" id="alumno_inNota3">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="alumno_btCancelar">Cancelar</button>
          <button type="button" class="btn btn-success" id="alumno_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import Cl_cCurso from "./dist/controllers/Cl_cCurso.js";
    import Cl_cAlumno from "./dist/controllers/Cl_cAlumno.js";

    // Importamos SOLO las vistas de Bootstrap
    import Cl_vCursoBootstrap from "./dist/views/Cl_vCursoBootstrap.js";
    import Cl_vAlumnoBootstrap from "./dist/views/Cl_vAlumnoBootstrap.js";

    // 1. Instanciamos las vistas
    const vistaCurso = new Cl_vCursoBootstrap();
    const vistaAlumno = new Cl_vAlumnoBootstrap();

    // 2. Inyectamos las vistas en los mismos controladores
    const controladorAlumno = new Cl_cAlumno(vistaAlumno);
    new Cl_cCurso(vistaCurso, controladorAlumno);
  </script>
</body>

</html>
